<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Tracker</title>
    <!-- We use PapaParse to easily read the CSV file -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #1db954;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            max-width: 1000px;
            margin-inline: auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .upload-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 30px;
            border: 2px dashed #333;
        }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            background-color: var(--accent);
            color: black;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
        }
        .era-section {
            margin-bottom: 40px;
        }
        .era-title {
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .song-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .song-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .song-title {
            font-size: 1.2em;
            font-weight: bold;
            margin: 0 0 5px 0;
        }
        .song-credits {
            color: var(--text-muted);
            font-size: 0.9em;
            margin: 0;
        }
        .song-details {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 0.85em;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 6px;
        }
        .detail-item {
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 4px;
        }
        .audio-player {
            width: 100%;
            height: 40px;
            margin-top: 10px;
        }
        .unavailable {
            color: #ff4444;
            font-style: italic;
            font-size: 0.9em;
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Music Tracker</h1>
    </div>

    <div class="upload-section">
        <p>Upload your exported Google Sheet (.csv format)</p>
        <label for="csvFileInput" class="upload-btn">Choose CSV File</label>
        <input type="file" id="csvFileInput" accept=".csv">
    </div>

    <div id="tracker-container"></div>

    <script>
        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Parse the CSV file
            Papa.parse(file, {
                complete: function(results) {
                    // Remove the first row if it contains your headers (Era, Song, etc.)
                    const data = results.data.slice(1);
                    processData(data);
                }
            });
        });

        function processData(data) {
            const eras = {};

            // Group songs by Era
            data.forEach(row => {
                // Ensure the row has enough columns to avoid errors
                if (row.length < 6 || !row[0]) return;

                const era = row[0].trim();
                if (!eras[era]) {
                    eras[era] = [];
                }
                eras[era].push({
                    title: row[1] || 'Unknown Song',
                    info: row[2] || '',
                    date: row[3] || 'Unknown Date',
                    availability: row[4] || 'Unknown',
                    quality: row[5] || '',
                    link: row[6] ? row[6].trim() : null
                });
            });

            renderTracker(eras);
        }

        function renderTracker(eras) {
            const container = document.getElementById('tracker-container');
            container.innerHTML = ''; // Clear previous renders

            // Sort the eras alphabetically (or you can leave them as they appeared in the sheet)
            const sortedEras = Object.keys(eras).sort();

            sortedEras.forEach(eraName => {
                // Create Era Section
                const section = document.createElement('div');
                section.className = 'era-section';
                
                const title = document.createElement('h2');
                title.className = 'era-title';
                title.textContent = eraName;
                section.appendChild(title);

                // Add Songs to Era
                eras[eraName].forEach(song => {
                    const card = document.createElement('div');
                    card.className = 'song-card';

                    // Parse credits (splitting by a newline if you use Alt+Enter in Google Sheets)
                    const titleParts = song.title.split('\n');
                    const mainTitle = titleParts[0];
                    const credits = titleParts.slice(1).join(' | ');

                    let html = `
                        <div class="song-header">
                            <div>
                                <p class="song-title">${mainTitle}</p>
                                ${credits ? `<p class="song-credits">${credits}</p>` : ''}
                            </div>
                        </div>
                        <div class="song-details">
                            <span class="detail-item">⏱️ ${song.info}</span>
                            <span class="detail-item">📅 ${song.date}</span>
                            <span class="detail-item">🏷️ ${song.availability}</span>
                            <span class="detail-item">🎧 ${song.quality}</span>
                        </div>
                    `;

                    // Handle MP3 link or Unavailable status
                    if (song.link && song.link.startsWith('http')) {
                        html += `<audio class="audio-player" controls preload="none">
                                    <source src="${song.link}" type="audio/mpeg">
                                    Your browser does not support the audio element.
                                 </audio>`;
                    } else {
                        html += `<div class="unavailable">Song Unavailable</div>`;
                    }

                    card.innerHTML = html;
                    section.appendChild(card);
                });

                container.appendChild(section);
            });
        }
    </script>
</body>
</html>
