<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #1db954;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            max-width: 1000px;
            margin-inline: auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .loading {
            text-align: center;
            color: var(--accent);
            font-size: 1.2em;
            margin-top: 50px;
        }
        .era-section {
            margin-bottom: 40px;
        }
        .era-title {
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .song-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .song-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .song-title {
            font-size: 1.2em;
            font-weight: bold;
            margin: 0 0 5px 0;
        }
        .song-credits {
            color: var(--text-muted);
            font-size: 0.9em;
            margin: 0;
        }
        .song-details {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 0.85em;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 6px;
        }
        .detail-item {
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 4px;
        }
        .audio-player {
            width: 100%;
            height: 40px;
            margin-top: 10px;
        }
        .unavailable {
            color: #ff4444;
            font-style: italic;
            font-size: 0.9em;
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Music Tracker</h1>
    </div>

    <div id="loading" class="loading">Loading songs from Google Sheets...</div>
    <div id="tracker-container"></div>

    <script>
        // Your specific Google Sheet CSV export link
        const SHEET_ID = '1shKl9S-r5d1vgzYGSEyWflyyn0LS_AKJ7Ydjsczbb0Y';
        const GID = '34972268';
        const sheetUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

        document.addEventListener('DOMContentLoaded', () => {
            Papa.parse(sheetUrl, {
                download: true,
                header: false,
                complete: function(results) {
                    document.getElementById('loading').style.display = 'none';
                    // Skip the first row assuming it's headers
                    const data = results.data.slice(1);
                    processData(data);
                },
                error: function(error) {
                    document.getElementById('loading').textContent = 'Error loading data. Make sure the Google Sheet is set to "Anyone with the link can view".';
                    console.error('Error fetching CSV:', error);
                }
            });
        });

        function processData(data) {
            const eras = {};

            data.forEach(row => {
                // Ensure row has enough columns and isn't totally blank
                if (row.length < 6 || !row[0]) return;

                const era = row[0].trim();
                if (!eras[era]) {
                    eras[era] = [];
                }
                
                eras[era].push({
                    title: row[1] || 'Unknown Song',
                    info: row[2] || '',
                    date: row[3] || 'Unknown Date',
                    availability: row[4] || 'Unknown',
                    quality: row[5] || '',
                    link: row[6] ? row[6].trim() : null
                });
            });

            renderTracker(eras);
        }

        function renderTracker(eras) {
            const container = document.getElementById('tracker-container');
            container.innerHTML = ''; 

            // Prevent displaying if empty
            if (Object.keys(eras).length === 0) {
                container.innerHTML = '<p style="text-align:center;">No valid data found in the spreadsheet.</p>';
                return;
            }

            // Sort eras alphabetically (optional - remove .sort() if you want them in Sheet order)
            const sortedEras = Object.keys(eras).sort();

            sortedEras.forEach(eraName => {
                const section = document.createElement('div');
                section.className = 'era-section';
                
                const title = document.createElement('h2');
                title.className = 'era-title';
                title.textContent = eraName;
                section.appendChild(title);

                eras[eraName].forEach(song => {
                    const card = document.createElement('div');
                    card.className = 'song-card';

                    const titleParts = song.title.split('\n');
                    const mainTitle = titleParts[0];
                    const credits = titleParts.slice(1).join(' | ');

                    let html = `
                        <div class="song-header">
                            <div>
                                <p class="song-title">${mainTitle}</p>
                                ${credits ? `<p class="song-credits">${credits}</p>` : ''}
                            </div>
                        </div>
                        <div class="song-details">
                            <span class="detail-item">⏱️ ${song.info}</span>
                            <span class="detail-item">📅 ${song.date}</span>
                            <span class="detail-item">🏷️ ${song.availability}</span>
                            <span class="detail-item">🎧 ${song.quality}</span>
                        </div>
                    `;

                    if (song.link && song.link.startsWith('http')) {
                        html += `<audio class="audio-player" controls preload="none">
                                    <source src="${song.link}" type="audio/mpeg">
                                    Your browser does not support the audio element.
                                 </audio>`;
                    } else {
                        html += `<div class="unavailable">Song Unavailable</div>`;
                    }

                    card.innerHTML = html;
                    section.appendChild(card);
                });

                container.appendChild(section);
            });
        }
    </script>
</body>
</html>
