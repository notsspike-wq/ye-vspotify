```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MP3 Archive</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0b;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 800px;
    margin: 80px auto;
    padding: 20px;
}

h1 {
    font-size: 42px;
    margin: 0;
}

.subtitle {
    color: #777;
    margin-top: 8px;
    margin-bottom: 35px;
}

.input {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 15px;

    background: #151515;
    color: white;

    border: 1px solid #333;
    border-radius: 8px;

    outline: none;
}

button {
    cursor: pointer;
    border: 0;
    border-radius: 8px;
    font-weight: bold;
}

.add {
    padding: 0 25px;
    background: white;
    color: black;
}

#songs {
    margin-top: 30px;
}

.song {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 18px;

    margin-bottom: 10px;

    background: #151515;

    border: 1px solid #242424;
    border-radius: 9px;
}

.song-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.song-url {
    color: #666;
    font-size: 12px;

    max-width: 550px;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.play {
    background: white;
    color: black;
    padding: 10px 18px;
}

#player {
    display: none;

    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;

    padding: 18px 25px;

    background: #111;
    border-top: 1px solid #292929;
}

#nowPlaying {
    font-weight: bold;
    margin-bottom: 10px;
}

audio {
    width: 100%;
}

#error {
    color: #ff6666;
    margin-top: 15px;
}

@media(max-width: 650px) {

    .input {
        flex-direction: column;
    }

    .add {
        height: 48px;
    }

    .song {
        flex-direction: column;
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>MP3 Archive</h1>

    <div class="subtitle">
        Paste an MP3 link to add a song.
    </div>

    <div class="input">

        <input
            id="url"
            type="url"
            placeholder="Paste MP3 URL..."
        >

        <button
            class="add"
            onclick="addSong()"
        >
            Add Song
        </button>

    </div>

    <div id="error"></div>

    <div id="songs"></div>

</div>


<div id="player">

    <div id="nowPlaying"></div>

    <audio
        id="audio"
        controls
    ></audio>

</div>


<script>

const songs = [];

const audio =
    document.getElementById("audio");

const player =
    document.getElementById("player");

const nowPlaying =
    document.getElementById("nowPlaying");


function addSong() {

    const input =
        document.getElementById("url");

    const error =
        document.getElementById("error");

    const url =
        input.value.trim();

    error.textContent = "";


    if (!url) {

        error.textContent =
            "Paste an MP3 URL.";

        return;
    }


    if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ) {

        error.textContent =
            "That doesn't look like a valid URL.";

        return;
    }


    const song = {

        name:
            "Song " +
            (songs.length + 1),

        url:
            url
    };


    songs.push(song);

    input.value = "";

    renderSongs();

    playSong(song);
}


function renderSongs() {

    const container =
        document.getElementById("songs");

    container.innerHTML = "";


    songs.forEach(
        (song, index) => {

            const element =
                document.createElement("div");

            element.className =
                "song";


            element.innerHTML = `

                <div>

                    <div class="song-name">
                        ${escapeHTML(song.name)}
                    </div>

                    <div class="song-url">
                        ${escapeHTML(song.url)}
                    </div>

                </div>

                <button
                    class="play"
                    onclick="playSong(songs[${index}])"
                >
                    ▶ Play
                </button>

            `;


            container.appendChild(element);
        }
    );
}


function playSong(song) {

    nowPlaying.textContent =
        "Now Playing: " +
        song.name;

    player.style.display =
        "block";


    audio.src =
        song.url;

    audio.load();


    audio.play()
        .catch(
            () => {

                document
                    .getElementById("error")
                    .textContent =
                    "The MP3 couldn't be played. Check that the URL is a direct MP3 file and allows browser access.";
            }
        );
}


function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/*
    Press Enter to add the song.
*/

document
    .getElementById("url")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                addSong();
            }
        }
    );

</script>

</body>
</html>
```
