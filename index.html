<script>

/* =========================================
   GLOBAL DATA
========================================= */

let songs = [];
let filteredSongs = [];

let currentSongIndex = -1;

let favoriteIDs = [];

let favoritesOnly = false;

const audio =
    document.getElementById("audio");


/* =========================================
   GOOGLE SHEETS URL
========================================= */

function makeCSVURL(sheetURL) {

    /*
       Extract spreadsheet ID.
    */

    const match =
        sheetURL.match(
            /\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/
        );

    if (!match) {
        throw new Error(
            "That isn't a valid Google Sheets URL."
        );
    }

    const spreadsheetID =
        match[1];


    /*
       Extract gid if supplied.
    */

    const gidMatch =
        sheetURL.match(
            /[?&#]gid=([0-9]+)/
        );


    const gid =
        gidMatch
        ? gidMatch[1]
        : "0";


    return (
        "https://docs.google.com/" +
        "spreadsheets/d/" +
        spreadsheetID +
        "/gviz/tq?" +
        "tqx=out:csv&gid=" +
        gid
    );
}


/* =========================================
   CSV PARSER
========================================= */

function parseCSV(text) {

    const rows = [];

    let row = [];
    let cell = "";

    let quoted = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];


        if (char === '"') {

            if (
                quoted &&
                text[i + 1] === '"'
            ) {

                cell += '"';

                i++;

            } else {

                quoted =
                    !quoted;
            }

        }

        else if (
            char === "," &&
            !quoted
        ) {

            row.push(cell);

            cell = "";

        }

        else if (
            (char === "\n" ||
             char === "\r") &&
            !quoted
        ) {

            if (
                char === "\r" &&
                text[i + 1] === "\n"
            ) {
                i++;
            }


            row.push(cell);


            if (
                row.some(
                    value =>
                        value.trim() !== ""
                )
            ) {

                rows.push(row);
            }


            row = [];
            cell = "";

        }

        else {

            cell += char;
        }
    }


    if (
        cell !== "" ||
        row.length
    ) {

        row.push(cell);

        if (
            row.some(
                value =>
                    value.trim() !== ""
            )
        ) {

            rows.push(row);
        }
    }


    return rows;
}


/* =========================================
   CLEAN TEXT
========================================= */

function clean(value) {

    return String(
        value || ""
    )
    .replace(
        /<br\s*\/?>/gi,
        " "
    )
    .replace(
        /\*\*/g,
        ""
    )
    .replace(
        /\*/g,
        ""
    )
    .trim();
}


/* =========================================
   EXTRACT URL
========================================= */

function extractURL(value) {

    if (!value)
        return "";


    const text =
        String(value).trim();


    /*
       Markdown:

       [text](https://...)
    */

    const markdown =
        text.match(
            /\]\((https?:\/\/[^)]+)\)/
        );

    if (markdown) {
        return markdown[1];
    }


    /*
       Plain URL
    */

    const url =
        text.match(
            /https?:\/\/[^\s\]\)]+/
        );

    if (url) {

        return url[0]
            .replace(
                /[.,;]+$/,
                ""
            );
    }


    return "";
}


/* =========================================
   DETECT AUDIO URL
========================================= */

function findAudio(row) {

    /*
       First look from RIGHT TO LEFT.

       Your example has the audio/link
       near the end of the row.
    */

    for (
        let i = row.length - 1;
        i >= 0;
        i--
    ) {

        const url =
            extractURL(
                row[i]
            );


        if (url) {

            return url;
        }
    }


    return "";
}


/* =========================================
   FIND SONG TITLE
========================================= */

function findSongTitle(row) {

    /*
       Your example:

       3
       Before The College Dropout
       187th
       Song description...
       2:56
       Apr 22, 2009
       Full
       Low Quality
       audio URL

       Therefore:

       Ignore the first numeric column.

       The first substantial text after
       the era is normally the song title.
    */


    for (
        let i = 0;
        i < row.length;
        i++
    ) {

        const value =
            clean(row[i]);


        if (!value)
            continue;


        /*
           Skip row numbers.
        */

        if (
            /^\d+$/.test(value)
        ) {
            continue;
        }


        /*
           Skip obvious dates.
        */

        if (
            /\b(19|20)\d{2}\b/.test(
                value
            ) &&
            (
                value.includes("/") ||
                value.includes("-") ||
                value.includes(" ")
            )
        ) {
            continue;
        }


        /*
           Skip durations.
        */

        if (
            /^\d{1,2}:\d{2}$/.test(
                value
            )
        ) {
            continue;
        }


        /*
           Skip statuses.
        */

        if (
            /^(full|partial|snippet|unavailable|tagged|stem bounce|low quality|high quality)$/i
                .test(value)
        ) {
            continue;
        }


        /*
           Skip URLs.
        */

        if (
            /^https?:\/\//i.test(
                value
            )
        ) {
            continue;
        }


        /*
           The second substantial field
           is normally the song.

           We skip the first text field
           because that is the era.
        */

        return value;
    }


    return "Untitled";
}


/* =========================================
   FIND ERA
========================================= */

function findEra(row) {

    /*
       Your archive structure puts the era
       immediately before the song title.

       Usually:

       [number]
       [era]
       [song]
       [description]
       ...
    */


    for (
        let i = 0;
        i < row.length;
        i++
    ) {

        const value =
            clean(row[i]);


        if (!value)
            continue;


        /*
           Skip row number.
        */

        if (
            /^\d+$/.test(value)
        ) {
            continue;
        }


        /*
           The first substantial text
           field is the era.
        */

        return value;
    }


    return "Unknown Era";
}


/* =========================================
   FIND DESCRIPTION
========================================= */

function findDescription(
    row,
    title
) {

    const titleIndex =
        row.findIndex(
            value =>
                clean(value) ===
                clean(title)
        );


    if (
        titleIndex !== -1 &&
        row[titleIndex + 1]
    ) {

        const description =
            clean(
                row[
                    titleIndex + 1
                ]
            );


        if (
            description &&
            !extractURL(
                description
            ) &&
            !/^\d{1,2}:\d{2}$/.test(
                description
            )
        ) {

            return description;
        }
    }


    return "";
}


/* =========================================
   BUILD ARCHIVE
========================================= */

function buildArchive(rows) {

    /*
       The first row in your spreadsheet
       may actually be a header/era summary.

       We don't force a header structure.

       Instead we analyze every row.
    */


    songs = [];


    rows.forEach(
        (row, index) => {

            const cleaned =
                row.map(
                    value =>
                        clean(value)
                );


            if (
                cleaned.every(
                    value => !value
                )
            ) {
                return;
            }


            /*
               Find URL.
            */

            const audioURL =
                findAudio(
                    row
                );


            /*
               If there is no URL,
               this may be an era/header
               row rather than a song.
            */

            if (!audioURL) {

                return;
            }


            /*
               Find song title.
            */

            const title =
                findSongTitle(
                    row
                );


            /*
               Find era.
            */

            const era =
                findEra(
                    row
                );


            /*
               Description.
            */

            const description =
                findDescription(
                    row,
                    title
                );


            /*
               Duration.
            */

            let duration = "";

            for (
                const value of cleaned
            ) {

                if (
                    /^\d{1,2}:\d{2}$/.test(
                        value
                    )
                ) {

                    duration =
                        value;

                    break;
                }
            }


            /*
               Status.
            */

            let status = "";

            for (
                const value of cleaned
            ) {

                if (
                    /^(full|partial|snippet|unavailable|tagged|stem bounce)$/i
                        .test(value)
                ) {

                    status =
                        value;

                    break;
                }
            }


            /*
               Quality.
            */

            let quality = "";

            for (
                const value of cleaned
            ) {

                if (
                    /quality/i.test(
                        value
                    )
                ) {

                    quality =
                        value;

                    break;
                }
            }


            /*
               Date.

               We look for something that
               resembles a date.
            */

            let date = "";

            for (
                const value of cleaned
            ) {

                if (
                    /\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{1,2},?\s+\d{4}\b/i
                        .test(value)
                ) {

                    date =
                        value;

                    break;
                }
            }


            songs.push({

                id:
                    songs.length,

                era,

                title,

                description,

                duration,

                date,

                status,

                quality,

                audio:
                    audioURL,

                originalRow:
                    index + 1
            });
        }
    );


    /*
       Show application.
    */

    document
        .getElementById(
            "import"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "app"
        )
        .style.display =
        "block";


    populateEras();

    render();
}


/* =========================================
   LOAD SHEET
========================================= */

async function loadSheet() {

    const input =
        document
        .getElementById(
            "sheetURL"
        );


    const error =
        document
        .getElementById(
            "error"
        );


    error.textContent = "";


    if (!input.value.trim()) {

        error.textContent =
            "Paste your Google Sheets link.";

        return;
    }


    try {

        const csvURL =
            makeCSVURL(
                input.value.trim()
            );


        const response =
            await fetch(
                csvURL
            );


        if (!response.ok) {

            throw new Error(
                "Google Sheets request failed."
            );
        }


        const text =
            await response.text();


        const rows =
            parseCSV(
                text
            );


        if (
            rows.length === 0
        ) {

            throw new Error(
                "No rows found."
            );
        }


        localStorage.setItem(
            "archiveSheet",
            input.value.trim()
        );


        buildArchive(
            rows
        );


    } catch (err) {

        console.error(
            err
        );


        error.textContent =
            "Couldn't read the Google Sheet. Make sure it is publicly accessible or published to the web.";
    }
}


/* =========================================
   ERA FILTER
========================================= */

function populateEras() {

    const select =
        document
        .getElementById(
            "eraFilter"
        );


    select.innerHTML =
        `<option value="all">
            All Eras
        </option>`;


    const eras =
        [
            ...new Set(
                songs.map(
                    song =>
                        song.era
                )
            )
        ];


    eras.forEach(
        era => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                era;


            option.textContent =
                era;


            select.appendChild(
                option
            );
        }
    );
}


/* =========================================
   RENDER
========================================= */

function render() {

    const search =
        document
        .getElementById(
            "search"
        )
        .value
        .toLowerCase();


    const era =
        document
        .getElementById(
            "eraFilter"
        )
        .value;


    filteredSongs =
        songs.filter(
            song => {

                const matchesSearch =
                    !search ||
                    song.title
                        .toLowerCase()
                        .includes(
                            search
                        ) ||
                    song.description
                        .toLowerCase()
                        .includes(
                            search
                        ) ||
                    song.era
                        .toLowerCase()
                        .includes(
                            search
                        );


                const matchesEra =
                    era === "all" ||
                    song.era === era;


                const matchesFavorites =
                    !favoritesOnly ||
                    favoriteIDs.includes(
                        song.id
                    );


                return (
                    matchesSearch &&
                    matchesEra &&
                    matchesFavorites
                );
            }
        );


    document
        .getElementById(
            "stats"
        )
        .textContent =
        `${filteredSongs.length} songs`;


    const library =
        document
        .getElementById(
            "library"
        );


    library.innerHTML = "";


    if (
        filteredSongs.length === 0
    ) {

        library.innerHTML =
            `<div class="empty">
                No songs found.
            </div>`;

        return;
    }


    /*
       Group by era.
    */

    const groups = {};


    filteredSongs.forEach(
        song => {

            if (
                !groups[song.era]
            ) {

                groups[song.era] =
                    [];
            }


            groups[song.era].push(
                song
            );
        }
    );


    Object.entries(
        groups
    ).forEach(
        ([era, eraSongs]) => {

            const section =
                document.createElement(
                    "section"
                );


            section.className =
                "era";


            const heading =
                document.createElement(
                    "div"
                );


            heading.className =
                "era-title";


            heading.textContent =
                era;


            section.appendChild(
                heading
            );


            eraSongs.forEach(
                (song, index) => {

                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "song";


                    if (
                        currentSongIndex ===
                            song.id &&
                        !audio.paused
                    ) {

                        row.classList.add(
                            "playing"
                        );
                    }


                    row.onclick =
                        () =>
                        playSong(
                            song
                        );


                    const favorite =
                        favoriteIDs.includes(
                            song.id
                        );


                    row.innerHTML = `

                        <div class="number">
                            ${index + 1}
                        </div>

                        <div>

                            <div class="song-title">
                                ${escapeHTML(
                                    song.title
                                )}
                            </div>

                            <div class="song-description">
                                ${escapeHTML(
                                    song.description
                                )}
                            </div>

                        </div>

                        <div class="info">
                            ${escapeHTML(
                                song.date
                            )}
                        </div>

                        <div class="info">
                            ${escapeHTML(
                                song.status
                            )}
                        </div>

                        <div class="info">
                            ${escapeHTML(
                                song.quality
                            )}
                        </div>

                        <div class="info">
                            ${escapeHTML(
                                song.duration
                            )}
                        </div>

                        <div
                            class="favorite ${
                                favorite
                                ? "active"
                                : ""
                            }"
                            onclick="
                                toggleFavorite(
                                    ${song.id},
                                    event
                                )
                            "
                        >
                            ${
                                favorite
                                ? "★"
                                : "☆"
                            }
                        </div>
                    `;


                    section.appendChild(
                        row
                    );
                }
            );


            library.appendChild(
                section
            );
        }
    );
}


/* =========================================
   PLAY SONG
========================================= */

function playSong(song) {

    const index =
        songs.findIndex(
            item =>
                item.id === song.id
        );


    if (index === -1)
        return;


    currentSongIndex =
        index;


    const url =
        song.audio;


    if (!url) {

        alert(
            "This row does not contain an audio URL."
        );

        return;
    }


    /*
       IMPORTANT:

       The URL is passed directly to
       the browser's audio element.
    */

    audio.pause();

    audio.src = url;

    audio.load();


    document

function nextSong() {

    if (
        filteredSongs.length === 0
    )
        return;


    let index =
        filteredSongs.findIndex(
            song =>
                song.id ===
                currentSongIndex
        );


    index++;


    if (
        index >=
        filteredSongs.length
    ) {

        index = 0;
    }


    playSong(
        filteredSongs[index]
    );
}


function previousSong() {

    if (
        filteredSongs.length === 0
    )
        return;


    let index =
        filteredSongs.findIndex(
            song =>
                song.id ===
                currentSongIndex
        );


    index--;


    if (index < 0) {

        index =
            filteredSongs.length - 1;
    }


    playSong(
        filteredSongs[index]
    );
}

function toggleFavorite(

) {

    event.stopPropagation();


    if (

    ) {

        favoriteIDs =
            favoriteIDs.filter(
                value =>
                    value !== id
            );

function escapeHTML(value) {

        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(

    .replace(

    .replace(

}
