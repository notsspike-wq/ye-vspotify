<body>

<header>
    <div class="logo">MUSIC ARCHIVE</div>

<div class="import" id="importScreen">

    <h1>Import your archive</h1>

    class="player"
    id="player"
>

    <audio id="audio"></audio>

    <input
        id="progress"
        class="progress"
        type="range"
        min="0"
        max="100"
        value="0"
    >

            id="nowTitle"
            class="now-title"

        </div>

        <button

            ⏮
        </button>

        </button>

</div>


<script>

let songs = [];
let filteredSongs = [];
let currentSong = null;
let favorites = [];

let favoritesOnly = false;

const audio =
    document.getElementById("audio");


/* =========================
   GOOGLE SHEET
========================= */

function getSheetURL(url) {

    const match =
        url.match(
            /\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/
        );

    if (!match) {
        throw new Error(
            "Invalid Google Sheets URL."
        );
    }

    const id = match[1];

    const gidMatch =
        url.match(
            /[?&#]gid=([0-9]+)/
        );

    const gid =
        gidMatch
        ? gidMatch[1]
        : "0";

    return (
        "https://docs.google.com/" +
        "spreadsheets/d/" +
        id +
        "/gviz/tq?" +
        "tqx=out:csv&gid=" +
        gid
    );
}


/* =========================
   CSV
========================= */

function parseCSV(text) {

    const rows = [];

    let row = [];
    let value = "";
    let quotes = false;

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const c = text[i];

        if (c === '"') {

            if (
                quotes &&
                text[i + 1] === '"'
            ) {

                value += '"';
                i++;

            } else {

                quotes = !quotes;
            }

        } else if (
            c === "," &&
            !quotes
        ) {

            row.push(value);
            value = "";

        } else if (
            (c === "\n" ||
             c === "\r") &&
            !quotes
        ) {

            if (
                c === "\r" &&
                text[i + 1] === "\n"
            ) {
                i++;
            }

            row.push(value);

            if (
                row.some(
                    x => x.trim()
                )
            ) {
                rows.push(row);
            }

            row = [];
            value = "";

        } else {

            value += c;
        }
    }

    if (value || row.length) {

        row.push(value);
        rows.push(row);
    }

    return rows;
}


/* =========================
   FIND COLUMN
========================= */

function normalize(value) {

    return String(value)
        .toLowerCase()
        .replace(
            /[^a-z0-9]/g,
            ""
        );
}


function column(headers, names) {

    for (
        const name of names
    ) {

        const index =
            headers.findIndex(
                header =>
                    normalize(header) ===
                    normalize(name)
            );

        if (index !== -1) {
            return index;
        }
    }

    return -1;
}


/* =========================
   LOAD
========================= */

async function loadSheet() {

    const url =
        document
        .getElementById("sheetURL")
        .value
        .trim();

    const error =
        document.getElementById(
            "error"
        );

    error.textContent = "";

    try {

        const csvURL =
            getSheetURL(url);

        const response =
            await fetch(csvURL);

        if (!response.ok) {
            throw new Error(
                "Could not access sheet."
            );
        }

        const text =
            await response.text();

        const rows =
            parseCSV(text);

        if (rows.length < 2) {
            throw new Error(
                "No data found."
            );
        }

        buildSongs(rows);

        localStorage.setItem(
            "sheetURL",
            url
        );

    } catch (errorObject) {

        console.error(errorObject);

        error.textContent =
            "Couldn't load the sheet. Make sure the sheet is publicly accessible.";
    }
}


/* =========================
   BUILD SONGS
========================= */

function buildSongs(rows) {

    const headers =
        rows[0];


    const era =
        column(
            headers,
            [
                "Era",
                "Period"
            ]
        );


    const title =
        column(
            headers,
            [
                "Song",
                "Title",
                "Track",
                "Name"
            ]
        );


    const description =
        column(
            headers,
            [
                "Description",
                "Notes",
                "Details"
            ]
        );


    const date =
        column(
            headers,
            [
                "Date",
                "Recorded",
                "Release Date"
            ]
        );


    const duration =
        column(
            headers,
            [
                "Duration",
                "Length",
                "Time"
            ]
        );


    const status =
        column(
            headers,
            [
                "Status",
                "Availability",
                "Type"
            ]
        );


    const quality =
        column(
            headers,
            [
                "Quality",
                "Audio Quality"
            ]
        );


    /*
       THIS IS THE IMPORTANT COLUMN.

       Put your actual audio URL here.

       Example:

       https://example.com/song.mp3
    */

    const audioURL =
        column(
            headers,
            [
                "Audio",
                "Audio URL",
                "Audio Link",
                "MP3",
                "Audio File"
            ]
        );


    songs =
        rows
        .slice(1)
        .map(
            (row, index) => {

                const get =
                    col =>
                    col === -1
                    ? ""
                    : (
                        row[col] ||
                        ""
                    );


                return {

                    id: index,

                    era:
                        get(era) ||
                        "Unknown Era",

                    title:
                        get(title) ||
                        "Untitled",

                    description:
                        get(description),

                    date:
                        get(date),

                    duration:
                        get(duration),

                    status:
                        get(status),

                    quality:
                        get(quality),

                    audio:
                        get(audioURL)

                };

            }
        )
        .filter(
            song =>
                song.title.trim()
        );


    document
        .getElementById(
            "importScreen"
        )
        .style.display = "none";


    document
        .getElementById(
            "app"
        )
        .style.display = "block";


    populateEras();

    render();
}


/* =========================
   ERAS
========================= */

function populateEras() {

    const select =
        document.getElementById(
            "eraFilter"
        );

    select.innerHTML =
        `<option value="all">
            All Eras
        </option>`;


    const eras =
        [
            ...new Set(
                songs.map(
                    song =>
                        song.era
                )
            )
        ];


    eras.forEach(
        era => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = era;
            option.textContent = era;

            select.appendChild(
                option
            );
        }
    );
}


/* =========================
   AUDIO URL
========================= */

function getAudioURL(value) {

    if (!value) return "";

    value =
        value.trim();


    /*
       Supports:

       https://site.com/song.mp3

       [audio](https://site.com/song.mp3)

       <https://site.com/song.mp3>
    */


    const markdown =
        value.match(
            /\((https?:\/\/[^)]+)\)/
        );

    if (markdown) {
        return markdown[1];
    }


    const angle =
        value.match(
            /<(https?:\/\/[^>]+)>/
        );

    if (angle) {
        return angle[1];
    }


    const url =
        value.match(
            /https?:\/\/[^\s]+/
        );

    if (url) {
        return url[0]
            .replace(
                /[)\],.;]+$/,
                ""
            );
    }


    return value;
}


/* =========================
   PLAY
========================= */

function playSong(song) {

    const url =
        getAudioURL(
            song.audio
        );


    if (!url) {

        alert(
            "This song has no audio URL."
        );

        return;
    }


    /*
       This is the actual browser
       audio player.
    */

    audio.src = url;

    currentSong = song;


    document
        .getElementById(
            "nowTitle"
        )
        .textContent =
        song.title;


    document
        .getElementById(
            "nowEra"
        )
        .textContent =
        song.era;


    document
        .getElementById(
            "player"
        )
        .style.display =
        "flex";


    audio.play()
        .then(
            () => {

                document
                    .getElementById(
                        "playButton"
                    )
                    .textContent =
                    "❚❚";

                render();

            }
        )
        .catch(
            error => {

                console.error(
                    error
                );

                alert(
                    "The audio link couldn't be played. The link must point directly to an audio file/stream and allow the browser to access it."
                );
            }
        );
}


/* =========================
   PLAY / PAUSE
========================= */

function togglePlay() {

    if (!audio.src) return;


    if (audio.paused) {

        audio.play();

    } else {

        audio.pause();
    }
}


/* =========================
   NEXT
========================= */

function nextSong() {

    if (!filteredSongs.length)
        return;


    const index =
        filteredSongs.findIndex(
            song =>
                song.id ===
                currentSong?.id
        );


    const next =
        index === -1 ||
        index + 1 >=
        filteredSongs.length
        ? filteredSongs[0]
        : filteredSongs[index + 1];


    playSong(next);
}


/* =========================
   PREVIOUS
========================= */

function previousSong() {

    if (!filteredSongs.length)
        return;


    const index =
        filteredSongs.findIndex(
            song =>
                song.id ===
                currentSong?.id
        );


    const previous =
        index <= 0
        ? filteredSongs[
            filteredSongs.length - 1
          ]
        : filteredSongs[index - 1];


    playSong(previous);
}


/* =========================
   AUDIO EVENTS
========================= */

audio.addEventListener(
    "play",
    () => {

        document
            .getElementById(
                "playButton"
            )
            .textContent =
            "❚❚";

        render();
    }
);


audio.addEventListener(
    "pause",
    () => {

        document
            .getElementById(
                "playButton"
            )
            .textContent =
            "▶";

        render();
    }
);


audio.addEventListener(
    "ended",
    nextSong
);


audio.addEventListener(
    "timeupdate",
    () => {

        if (!audio.duration)
            return;


        document
            .getElementById(
                "progress"
            )
            .value =
            (
                audio.currentTime /
                audio.duration
            ) * 100;
    }
);


/* =========================
   PROGRESS
========================= */

document
    .getElementById(
        "progress"
    )
    .addEventListener(
        "input",
        function() {

            if (!audio.duration)
                return;


            audio.currentTime =
                (
                    this.value /
                    100
                ) *
                audio.duration;
        }
    );


/* =========================
   VOLUME
========================= */

document
    .getElementById(
        "volume"
    )
    .addEventListener(
        "input",
        function() {

            audio.volume =
                this.value;
        }
    );


/* =========================
   FAVORITES
========================= */

function loadFavorites() {

    try {

        favorites =
            JSON.parse(
                localStorage.getItem(
                    "favorites"
                )
            ) || [];

    } catch {

        favorites = [];
    }
}


function toggleFavorite(
    id,
    event
) {

    event.stopPropagation();


    if (
        favorites.includes(id)
    ) {

        favorites =
            favorites.filter(
                x => x !== id
            );

    } else {

        favorites.push(id);
    }


    localStorage.setItem(
        "favorites",
        JSON.stringify(
            favorites
        )
    );


    render();
}


loadFavorites();


/* =========================
   RENDER
========================= */

function render() {

    const search =
        document
        .getElementById(
            "search"
        )
        .value
        .toLowerCase();


    const era =
        document
        .getElementById(
            "eraFilter"
        )
        .value;


    filteredSongs =
        songs.filter(
            song => {

                const searchMatch =
                    song.title
                    .toLowerCase()
                    .includes(search)

                    ||

                    song.description
                    .toLowerCase()
                    .includes(search);


                const eraMatch =
                    era === "all" ||
                    song.era === era;


                const favoriteMatch =
                    !favoritesOnly ||
                    favorites.includes(
                        song.id
                    );


                return (
                    searchMatch &&
                    eraMatch &&
                    favoriteMatch
                );
            }
        );


    document
        .getElementById(
            "stats"
        )
        .textContent =
        `${filteredSongs.length} songs`;


    const library =
        document.getElementById(
            "library"
        );

    library.innerHTML = "";


    /*
       Group by era
    */

    const groups = {};


    filteredSongs.forEach(
        song => {

            if (!groups[song.era]) {
                groups[song.era] = [];
            }

            groups[song.era].push(
                song
            );
        }
    );


    Object.entries(
        groups
    ).forEach(
        ([era, eraSongs]) => {

            const section =
                document.createElement(
                    "section"
                );

            section.className =
                "era";


            const heading =
                document.createElement(
                    "div"
                );

            heading.className =
                "era-title";

            heading.textContent =
                era;


            section.appendChild(
                heading
            );


            eraSongs.forEach(
                (song, index) => {

                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "song";


                    if (
                        currentSong &&
                        currentSong.id ===
                        song.id &&
                        !audio.paused
                    ) {

                        row.classList.add(
                            "playing"
                        );
                    }


                    row.onclick =
                        () =>
                        playSong(song);


                    const favorite =
                        favorites.includes(
                            song.id
                        );


                    row.innerHTML = `

                        <div class="number">
                            ${index + 1}
                        </div>

                        <div>

                            <div class="title">
                                ${escapeHTML(
                                    song.title
                                )}
                            </div>

                            <div class="description">
                                ${escapeHTML(
                                    song.description
                                )}
                            </div>

                        </div>

                        <div class="info">
                            ${escapeHTML(
                                song.date
                            )}
                        </div>

                        <div class="info">
                            ${escapeHTML(
                                song.status
                            )}
                        </div>

                        <div class="info">
                            ${escapeHTML(
                                song.duration
                            )}
                        </div>

                        <div
                            class="favorite ${
                                favorite
                                ? "active"
                                : ""
                            }"
                            onclick="
                                toggleFavorite(
                                    ${song.id},
                                    event
                                )
                            "
                        >
                            ${
                                favorite
                                ? "★"
                                : "☆"
                            }
                        </div>

                    `;


                    section.appendChild(
                        row
                    );
                }
            );


            library.appendChild(
                section
            );
        }
    );
}


/* =========================
   ESCAPE
========================= */

function escapeHTML(value) {

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================
   SEARCH
========================= */

document
    .getElementById(
        "search"
    )
    .addEventListener(
        "input",
        render
    );


document
    .getElementById(
        "eraFilter"
    )
    .addEventListener(
        "change",
        render
    );


document
    .getElementById(
        "favFilter"
    )
    .addEventListener(
        "click",
        function() {

            favoritesOnly =
                !favoritesOnly;


            this.style.background =
                favoritesOnly
                ? "#333"
                : "#151515";


            render();
        }
    );


/* =========================
   REMEMBER SHEET
========================= */

const saved =
    localStorage.getItem(
        "sheetURL"
    );


if (saved) {

    document
        .getElementById(
            "sheetURL"
        )
        .value = saved;
}

</script>
